baseURL: "https://ssarode1410.github.io/"
languageCode: "en-us"
title: "Shantanu's Portfolio"
theme: "PaperMod"

params:
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true

  env: production
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
    
  # This turns on the Sidebar for posts/projects
  widgets:
    - search
    - tags
    - archives
  
  # Profile Mode Settings
  profileMode:
    enabled: true
    title: "Shantanu Sarode"
    subtitle: "IT Specialist | Transitioning to DevOps & Cloud | Lifelong Learner | AWS & Azure | Terraform | Kubernetes | CI/CD"
    imageUrl: "/images/Professional-headshot.png"
    imageTitle: "My Profile Picture"
    imageWidth: 200
    imageHeight: 230
    buttons:
      - name: Projects
        url: /projects
      - name: Resume
        url: /Shantanu_Sarode_resume1.pdf
      - name: Github
        url: https://github.com/ssarode1410

  # --- MOVED HERE (Indented inside params) ---
  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/shantanu-sarode"
    - name: github
      url: "https://github.com/ssarode1410"
    - name: email
      url: "mailto:sarode437@gmail.com"
  # -------------------------------------------

menu:
  main:
    - identifier: about
      name: About Me
      url: /about
      weight: 5
    - identifier: projects
      name: Projects
      url: /projects
      weight: 10
    - identifier: skills  <-- ADD THIS BLOCK
      name: Skills
      url: /tags
      weight: 15
    - identifier: blog
      name: Learning Blog
      url: /posts
      weight: 20